<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Librería | Libros disponibles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Libros disponibles</h1>
    <p>Elige tu próxima lectura entre los títulos de nuestro catálogo.</p>
  </header>

  <main>
    <p id="mensaje" role="status" aria-live="polite">Cargando libros...</p>
    <div id="libros"></div>
  </main>

  <script>
    // Ruta relativa: funciona igual en local y en Vercel (misma URL del sitio).
    const API_URL = '/api/libros';

    const COLORES = ['#23423a', '#3b3f5c', '#6b2f3a', '#4a3b2a', '#2f4858', '#5a4a6b'];

    function colorPara(texto) {
      let h = 0;
      for (let i = 0; i < texto.length; i++) h = (h * 31 + texto.charCodeAt(i)) >>> 0;
      return COLORES[h % COLORES.length];
    }

    function comprar(titulo, boton) {
      document.getElementById('mensaje').textContent = 'Compra simulada: ' + titulo;
      boton.textContent = 'Comprado';
      boton.disabled = true;
    }

    function crearTarjeta(libro) {
      const tarjeta = document.createElement('article');
      tarjeta.className = 'libro';

      const portada = document.createElement('div');
      portada.className = 'portada';
      portada.style.backgroundColor = colorPara(libro.titulo || '');

      const titulo = document.createElement('h2');
      titulo.textContent = libro.titulo;
      portada.appendChild(titulo);

      const autor = document.createElement('p');
      autor.className = 'autor';
      autor.textContent = libro.autor || '';
      portada.appendChild(autor);

      const detalle = document.createElement('p');
      detalle.className = 'detalle';
      detalle.textContent = [libro.anioPublicacion, libro.genero]
        .filter(function (v) { return v !== null && v !== undefined && v !== ''; })
        .join(', ');

      const boton = document.createElement('button');
      boton.type = 'button';
      boton.textContent = 'Comprar';
      boton.setAttribute('aria-label', 'Comprar ' + libro.titulo);
      boton.addEventListener('click', function () { comprar(libro.titulo, boton); });

      tarjeta.append(portada, detalle, boton);
      return tarjeta;
    }

    async function cargarLibros() {
      const contenedor = document.getElementById('libros');
      const mensaje = document.getElementById('mensaje');
      mensaje.className = '';
      mensaje.textContent = 'Cargando libros...';

      try {
        const respuesta = await fetch(API_URL);
        if (!respuesta.ok) throw new Error('HTTP ' + respuesta.status);

        const libros = await respuesta.json();
        contenedor.textContent = '';
        mensaje.textContent = '';

        if (libros.length === 0) {
          mensaje.textContent = 'Aún no hay libros en el catálogo.';
          return;
        }
        libros.forEach(function (libro) { contenedor.appendChild(crearTarjeta(libro)); });
      } catch (error) {
        console.error(error);
        mensaje.className = 'error';
        mensaje.textContent = 'No se pudieron cargar los libros.';
        const reintentar = document.createElement('button');
        reintentar.type = 'button';
        reintentar.textContent = 'Reintentar';
        reintentar.addEventListener('click', cargarLibros);
        mensaje.appendChild(reintentar);
      }
    }

    cargarLibros();
  </script>
</body>
</html>
