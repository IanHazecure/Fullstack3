spring.application.name=biblioteca
server.port=8080

# Oracle Autonomous Database wallet. The password is supplied through DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@fullstack3_high}
spring.datasource.username=${DB_USERNAME:ADMIN}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.data-source-properties.oracle.net.tns_admin=${TNS_ADMIN:C:/Users/Felipe/Desktop/wallet_fullstack3}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET:local-development-secret-change-before-deployment-2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:7200000}
